<div class="login-container">
  <div class="login-box">
    <h1>Garagem</h1>
    <h2>Login</h2>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="Email"
          placeholder="seu.email@exemplo.com"
          [class.error]="loginForm.get('Email')?.invalid && loginForm.get('Email')?.touched"
        />
        <span class="error-text" *ngIf="loginForm.get('Email')?.touched && emailError">
          {{ emailError }}
        </span>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="Password"
          placeholder="Sua senha"
          [class.error]="loginForm.get('Password')?.invalid && loginForm.get('Password')?.touched"
        />
        <span class="error-text" *ngIf="loginForm.get('Password')?.touched && passwordError">
          {{ passwordError }}
        </span>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="isLoading">Entrando...</span>
        <span *ngIf="!isLoading">Entrar</span>
      </button>
    </form>

    <p class="register-link">
      Não tem conta? <a routerLink="/register">Registre-se aqui</a>
    </p>
  </div>
</div>
