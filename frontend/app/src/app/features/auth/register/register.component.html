<div class="register-container">
  <div class="register-box">
    <h1>Garagem</h1>
    <h2>Criar Conta</h2>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="firstName">Primeiro Nome</label>
        <input
          id="firstName"
          type="text"
          formControlName="FirstName"
          placeholder="João"
          [class.error]="registerForm.get('FirstName')?.invalid && registerForm.get('FirstName')?.touched"
        />
        <span class="error-text" *ngIf="registerForm.get('FirstName')?.touched && getFieldError('FirstName')">
          {{ getFieldError('FirstName') }}
        </span>
      </div>

      <div class="form-group">
        <label for="lastName">Último Nome</label>
        <input
          id="lastName"
          type="text"
          formControlName="LastName"
          placeholder="Silva"
          [class.error]="registerForm.get('LastName')?.invalid && registerForm.get('LastName')?.touched"
        />
        <span class="error-text" *ngIf="registerForm.get('LastName')?.touched && getFieldError('LastName')">
          {{ getFieldError('LastName') }}
        </span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="Email"
          placeholder="seu.email@exemplo.com"
          [class.error]="registerForm.get('Email')?.invalid && registerForm.get('Email')?.touched"
        />
        <span class="error-text" *ngIf="registerForm.get('Email')?.touched && getFieldError('Email')">
          {{ getFieldError('Email') }}
        </span>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="Password"
          placeholder="Sua senha"
          [class.error]="registerForm.get('Password')?.invalid && registerForm.get('Password')?.touched"
        />
        <span class="error-text" *ngIf="registerForm.get('Password')?.touched && getFieldError('Password')">
          {{ getFieldError('Password') }}
        </span>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid || isLoading">
        <span *ngIf="isLoading">Criando conta...</span>
        <span *ngIf="!isLoading">Criar Conta</span>
      </button>
    </form>

    <p class="login-link">
      Já tem conta? <a routerLink="/login">Faça login</a>
    </p>
  </div>
</div>
