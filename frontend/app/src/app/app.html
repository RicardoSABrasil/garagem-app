<div class="app-shell">
  <header class="app-header">
    <div class="app-brand">
      <a routerLink="/" class="brand-link">Garagem</a>
      <button
        type="button"
        class="mobile-toggle"
        (click)="toggleMenu()"
        aria-label="Abrir menu"
        [attr.aria-expanded]="menuOpen()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="app-nav" [class.open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" (click)="closeMenu()">Início</a>
      <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">Meu Perfil</a>
      <a
        routerLink="/login"
        routerLinkActive="active"
        *ngIf="!(isAuthenticated$ | async)"
        (click)="closeMenu()"
      >
        Login
      </a>
      <a
        routerLink="/register"
        routerLinkActive="active"
        *ngIf="!(isAuthenticated$ | async)"
        (click)="closeMenu()"
      >
        Registrar
      </a>
      <button
        type="button"
        class="nav-action"
        *ngIf="isAuthenticated$ | async"
        (click)="logout()"
      >
        Sair
      </button>
    </nav>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    Garagem SSR moderno · Frontend preparado para expansão.
  </footer>
</div>
