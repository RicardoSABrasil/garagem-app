services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: garagem-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Garagem@123"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

  redis:
    image: redis:7
    container_name: garagem-redis

    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: garagem-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit
    container_name: garagem-mailpit

    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  sqlserver_data:
  minio_data: